services:
  snee-backend-spes:
    image: end2040/snee_web_spes-backend:latest
    container_name: snee-backend-spes
    restart: always
    ports:
      - "8002:8002"
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
    networks:
      - snee-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  snee-frontend-spes:
    image: end2040/snee_web_spes-frontend:latest
    container_name: snee-frontend-spes
    restart: always
    ports:
      - "3002:80"
    networks:
      - snee-network
    depends_on:
      - snee-backend-spes
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  snee-network:
    driver: bridge