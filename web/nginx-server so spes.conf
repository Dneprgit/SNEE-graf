# Конфигурация Nginx для сервера Reg.ru
# Этот файл нужно разместить на сервере по пути: /etc/nginx/sites-available/snee-graf
# 
# Поддерживает два проекта одновременно:
# - dneprovskii.ru (порты 8001, 3001) - старый проект
# - so-spes.ru (порты 8002, 3002) - новый проект

# ==========================================
# Upstreams для dneprovskii.ru (старый)
# ==========================================


# ==========================================
# Upstreams для so-spes.ru (новый)
# ==========================================
upstream snee_backend_spes {
    server 127.0.0.1:8002;
}

upstream snee_frontend_spes {
    server 127.0.0.1:3002;
}

# ==========================================
# HTTP серверы - редирект на HTTPS
# ==========================================

# HTTP для so-spes.ru
server {
    listen 80;
    listen [::]:80;
    server_name so-spes.ru www.so-spes.ru;

    # Для Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Редирект всех остальных запросов на HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}


# ==========================================
# HTTPS сервер для so-spes.ru (новый)
# ==========================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name so-spes.ru www.so-spes.ru;

    # SSL сертификаты от Let's Encrypt_old
    # ssl_certificate /etc/letsencrypt/certbot/config/live/so-spes.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/certbot/config/live/so-spes.ru/privkey.pem;
    # ssl_trusted_certificate /etc/letsencrypt/certbot/config/live/so-spes.ru/chain.pem;

    # SSL сертификаты от Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/so-spes.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/so-spes.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/so-spes.ru/chain.pem;

    # SSL настройки (современные и безопасные)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Логи
    access_log /var/log/nginx/snee-spes-access.log;
    error_log /var/log/nginx/snee-spes-error.log;

    # Размер загружаемых файлов (для Excel)
    client_max_body_size 10M;

    # Backend API - проксирование к FastAPI
    location /api {
        proxy_pass http://snee_backend_spes;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # API документация
    location /docs {
        proxy_pass http://snee_backend_spes/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /redoc {
        proxy_pass http://snee_backend_spes/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://snee_backend_spes/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Frontend - проксирование к контейнеру с frontend
    location / {
        proxy_pass http://snee_frontend_spes;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;
    gzip_proxied any;
}

