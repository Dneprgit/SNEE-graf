  snee-backend-spes:
    image: end2040/snee_web_spes-backend:latest
    container_name: snee-backend-spes
    restart: always
    ports:
      - "8002:8002"
    environment:
      # Основные настройки
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      
      # API настройки
      - API_TITLE=SNEE Graf API
      - API_VERSION=2.0.0
      - API_DESCRIPTION=API для расчета диспетчерского графика СНЭЭ
      
      # CORS - ВАЖНО! Укажите ваш домен
      - ALLOWED_ORIGINS=https://so-spes.ru,https://www.so-spes.ru
      
      # Лимиты
      - MAX_UPLOAD_SIZE=10485760
      
      # Логирование
      - LOG_LEVEL=INFO
      
      # Workers
      - WORKERS=2
      
      # Таймауты
      - REQUEST_TIMEOUT=60
      - HTML_TASKS_DIR=/opt/snee-graf/html_task
    volumes:
      - /opt/snee-graf/html_task:/opt/snee-graf/html_task:ro
    networks:
      - snee-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  snee-frontend-spes:
    image: end2040/snee_web_spes-frontend:latest
    container_name: snee-frontend-spes
    restart: always
    ports:
      - "3002:80"
    # Frontend НЕ нуждается в env переменных на runtime,
    # так как VITE_* переменные запекаются в build time
    networks:
      - snee-network
    depends_on:
      - snee-backend-spes
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s